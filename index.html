<style>
:root{
  /* Bố cục: thanh trên · cột slide · canvas · bảng soát lỗi. Màu giao diện trung tính, màu brand chỉ nằm trong slide. */
  --ui-bg:#eef0f2; --ui-panel:#ffffff; --ui-line:#dde1e5; --ui-ink:#1d2327; --ui-muted:#5d6670; --ui-accent:#1f5f8b; --ui-canvas:#e2e6ea;
  --ok:#2d8a4e; --warn:#b07800; --bad:#c0392b; --ok-bg:#e8f3ea; --warn-bg:#fbf3df; --bad-bg:#fbeceb;
  --font-ui:'Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ui-bg:#15191c;--ui-panel:#1d2226;--ui-line:#30373d;--ui-ink:#e7eaed;--ui-muted:#9aa4ad;--ui-accent:#5fa3d6;--ui-canvas:#101315;--ok-bg:#183223;--warn-bg:#34290d;--bad-bg:#3a1a17;color-scheme:dark}}
:root[data-theme="dark"]{--ui-bg:#15191c;--ui-panel:#1d2226;--ui-line:#30373d;--ui-ink:#e7eaed;--ui-muted:#9aa4ad;--ui-accent:#5fa3d6;--ui-canvas:#101315;--ok-bg:#183223;--warn-bg:#34290d;--bad-bg:#3a1a17;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);font:13px/1.45 var(--font-ui);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--ui-panel);border-bottom:1px solid var(--ui-line)}
.brandmark{display:flex;align-items:center;gap:10px;margin-right:6px}
.brandmark .logo{width:28px;height:28px;border-radius:7px;background:var(--ui-ink);color:var(--ui-panel);display:grid;place-items:center;font-weight:700;font-size:11px}
.brandmark small{display:block;color:var(--ui-muted)}
.spacer{flex:1 1 auto}
.btn{padding:8px 12px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel);min-height:36px}
.btn.primary,.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff;font-weight:600}
select{padding:7px 8px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel)}
label.file{position:relative;overflow:hidden}
label.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.work{flex:1 1 auto;display:flex;flex-wrap:wrap;min-height:0}
nav{flex:0 1 210px;background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:12px;overflow:auto;max-height:calc(100vh - 100px)}
nav .head{display:flex;justify-content:space-between;color:var(--ui-muted);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.thumb{width:100%;padding:6px;border:1px solid transparent;border-radius:8px;background:none;text-align:left;display:flex;flex-direction:column;gap:5px}
.thumb.sel{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 8%,transparent)}
.thumb .cap{font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.ok{background:var(--ok)}.dot.vang{background:var(--warn)}.dot.do{background:var(--bad)}
.scaled{position:relative;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px var(--ui-line)}
.scaled>.pls-slide{position:absolute;left:0;top:0}
main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px;padding:16px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.mhead b{font-size:15px}
.muted{color:var(--ui-muted)}
#notesBox{margin-top:10px;border:1px solid var(--ui-line);border-radius:8px;padding:8px 10px}#notesBox summary{cursor:pointer}#notesBox textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0 6px;font:13px/1.5 inherit;font-family:inherit;padding:8px;border:1px solid var(--ui-line);border-radius:6px;resize:vertical;background:transparent;color:inherit}
#canvas{flex:1 1 auto;min-height:360px;display:flex;align-items:center;justify-content:center;padding:16px;border-radius:10px;background:var(--ui-canvas);overflow:auto}
#canvas .scaled{box-shadow:0 2px 12px rgba(0,0,0,.18)}
#canvas [contenteditable]{outline:none;cursor:text}
#canvas [contenteditable]:hover{box-shadow:0 0 0 3px rgba(31,95,139,.35)}
#canvas [contenteditable]:focus{box-shadow:0 0 0 4px #1f5f8b}
.pls-slide .bad{box-shadow:0 0 0 4px var(--bad)!important}
.pls-slide .warn{box-shadow:0 0 0 4px var(--warn)}
.pls-imgslot{background-color:#ffffff!important;background-image:repeating-linear-gradient(45deg,#eef1f4 0 14px,#f8f9fa 14px 28px)!important;box-shadow:inset 0 0 0 3px #cfd6dc}
.pls-imgslot::after{content:attr(data-img-label);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:500 22px/1.2 'Be Vietnam Pro',sans-serif;color:#66717c}
.pls-imgslot{position:relative}
#canvas .pls-imgempty{outline:2px dashed rgba(31,95,139,.35);outline-offset:-6px}
aside{flex:1 1 300px;max-width:360px;background:var(--ui-panel);border-left:1px solid var(--ui-line);display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
[role=tablist]{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ui-line);padding:0 8px}
[role=tab]{padding:12px 10px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ui-muted)}
[role=tab][aria-selected=true]{color:var(--ui-ink);font-weight:600;border-bottom-color:var(--ui-accent)}
#panel{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.tiles{display:flex;gap:8px}
.tile{flex:1 1 0;padding:10px;border-radius:8px;display:flex;flex-direction:column}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile.do{background:var(--bad-bg)}.tile.vang{background:var(--warn-bg)}.tile.ok{background:var(--ok-bg)}
.issue{display:flex;flex-direction:column;gap:5px;padding:10px;border:1px solid var(--ui-line);border-radius:8px}
#canvas .pls-imgpick{cursor:pointer}
#canvas .pls-imgpick:hover{box-shadow:0 0 0 6px rgba(31,95,139,.55)!important}
#canvas .pls-imgpick:focus-visible{outline:6px solid #1f5f8b;outline-offset:2px}
.issue.focus{border-color:var(--ui-accent);box-shadow:0 0 0 2px var(--ui-accent)}
.std{border:1px solid var(--ui-line);border-radius:8px;padding:10px}
.std summary{cursor:pointer;line-height:1.9}
.stdrow{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;padding:7px 0;border-top:1px solid var(--ui-line)}
.stdrow .st{font-weight:700;text-align:center}
.stdrow.loi.do .st{color:var(--bad)}.stdrow.loi.vang .st,.stdrow.loi.xam .st{color:var(--warn)}.stdrow.dat .st{color:var(--ok)}.stdrow.tay .st{color:var(--ui-muted)}
.fxrow{display:flex;gap:8px;align-items:center}
.fxlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
#fxPace,#trStyle,#trScope,#trDur{width:100%}
.pack{border-top:1px dashed var(--ui-line);padding-top:6px}
.pack summary,.review summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;margin:4px 0;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-canvas)}
.pack summary::-webkit-details-marker,.review summary::-webkit-details-marker{display:none}
.pack summary::after,.review summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:0 0 auto}
.pack[open] summary::after,.review[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.pack summary:hover,.review summary:hover{border-color:currentColor}
.pack .prompt{min-height:120px;margin:6px 0}
.pack .acts,.issue>.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pack .acts .btn,.issue>.row .btn,.issue>.row button{white-space:nowrap;flex:0 0 auto;width:auto}
.issue>.row input[type=search]{flex:1 1 140px;min-width:0}
.review{border:1px solid var(--ui-line);border-radius:10px;padding:8px 10px;margin:8px 0}
.review .issue{margin-top:8px}
.cands a{display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid var(--ui-line);border-radius:6px;font-size:11px;text-align:center;color:inherit;text-decoration:none}
.cands a img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--ui-bg);border-radius:4px}
.issue .row{display:flex;justify-content:space-between;gap:8px}
.issue button{align-self:flex-start;padding:5px 10px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel)}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.do{background:var(--bad-bg);color:var(--bad)}.pill.vang{background:var(--warn-bg);color:var(--warn)}
.plan{display:grid;grid-template-columns:minmax(0,1fr) 80px 32px;gap:10px;align-items:center;padding:10px;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-panel);text-align:left}
.plan.active{border-color:var(--ui-accent);box-shadow:inset 0 0 0 1px var(--ui-accent)}
.plan .bar{height:8px;border-radius:4px;background:var(--ui-line);overflow:hidden}.plan .bar i{display:block;height:100%;background:var(--ui-accent)}
.plan b{text-align:right;font-variant-numeric:tabular-nums}
.imgnow{width:100%;max-height:160px;object-fit:contain;background:var(--ui-bg);border-radius:6px}
.cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cands button{display:flex;flex-direction:column;gap:3px;padding:4px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel);font-size:11px;text-align:center}
.cands img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--ui-bg);border-radius:4px}
.cands span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=search]{flex:1 1 auto;min-width:0;padding:6px 8px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel)}
textarea{width:100%;min-height:340px;padding:8px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-bg);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
pre{margin:0;padding:10px;border-radius:6px;background:var(--ui-bg);overflow:auto}
footer{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));background:var(--ui-panel);border-top:1px solid var(--ui-line);color:var(--ui-muted);font-size:12px}
.menuwrap{position:relative}

:root{--ui-bg:#f8f4e9;--ui-panel:#fffcf4;--ui-line:#e6dfcb;--ui-ink:#1e1c19;--ui-muted:#77705f;--ui-accent:#7c5cd6;--ui-yellow:#f6b81c;--ui-beige:#ece6d3;--ui-canvas:#ece6d3;--ui-ink-on:#fffcf4;

.brandmark .logo{width:34px;height:34px;border-radius:50%;background:var(--ui-ink);color:var(--ui-ink-on);font-size:11px;letter-spacing:.02em;position:relative}
